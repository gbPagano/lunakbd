[keyboard]
name = "lunakbd"
product_name = "lunakbd"
vendor_id = 0x4c4b
product_id = 0x4643
manufacturer = "gbpagano"
# The nice!nano_v2 board default enables the battery ADC on "vddh". The
# central is a USB-powered dongle with no battery, so use the plain chip
# default instead (no battery_adc_pin) and re-enable the DCDC regulators
# that the generic nrf52840 default disables.
# board = "nice!nano_v2"
chip = "nrf52840"
usb_enable = true

[chip.nrf52840]
dcdc_reg0 = true
dcdc_reg1 = true

[layout]
rows = 5
cols = 12
map = """
[3.5] (0,3) [7.5] (0,9)
[y=-0.875]
[2.5] (0,2) [1.0] (0,4) [5.5] (0,10) [1.0] (0,8)
[y=-0.875]
[5.5] (0,5) [3.5] (0,11)
[y=-0.875]
[0.5] (0,0) [12.5] (0,7) (0,6)
[y=-0.995]
[1.5] (0,1)
[y=-0.38]
[3.5] (1,3) [7.5] (1,9)
[y=-0.875]
[2.5] (1,2) [1.0] (1,4) [5.5] (1,10) [1.0] (1,8)
[y=-0.875]
[5.5] (1,5) [3.5] (1,11)
[y=-0.875]
[0.5] (1,0) (1,1) [11.5] (1,7) (1,6)
[y=-0.375]
[3.5] (2,3) [7.5] (2,9)
[y=-0.875]
[2.5] (2,2) [1.0] (2,4) [5.5] (2,10) [1.0] (2,8)
[y=-0.875]
[5.5] (2,5) [3.5] (2,11)
[y=-0.875]
[0.5] (2,0) (2,1) [11.5] (2,7) (2,6)
[y=-1.0]
[6.75] (e,0) [1.0] (e,1)
[y=-0.375]
[3.5] (3,3) [7.5] (3,9)
[y=-0.875]
[2.5] (3,2) [1.0] (3,4) [5.5] (3,10) [1.0] (3,8)
[y=-0.875]
[5.5] (3,5) [0.36] (4,1,@s1) [1.25] (4,7,@s1) [0.39] (3,11)
[y=-0.875]
[0.5] (3,0) (3,1) [11.5] (3,7) (3,6)
[y=-0.125]
[4.0] (4,3) [6.5] (4,9)
[y=-1.0]
[r=15.0@(4.5,9.1)] [4.0] (4,4)
[y=-1.0]
[r=15.0@(12.0,9.1)] [11.5] (4,8)
[y=-0.75]
[r=30.0@(5.4,9.3)] [4.0] (4,5,@s2)
[y=-1.0]
[r=-30.0@(11.1,9.3)] [11.5] (4,11,@s2)
[y=-1.25]
[r=-15.0@(4.5,9.1)] [4.0] (4,2)
[y=-1.0]
[r=-15.0@(12.0,9.1)] [11.5] (4,10)
"""

[layout.shapes]
s1 = { w = 0.75, h = 0.75 }
s2 = { h = 1.25 }

[keymap]
layers = 6

[[keymap.layer]]
name = "base"
keys = """
Kc3 Kc8 Kc2 Kc4 Kc7 Kc9 Kc5 Kc6 Grave Kc0 Minus Kc1
E I W R U O T Y Tab Q P Backspace
D K S F J L G H MT(Escape,LShift) A Semicolon MT(Enter,RShift)
C Comma X V M Dot B MediaNextTrack AudioMute N MT(Home,LCtrl|LAlt) Z Slash MT(End,LCtrl|LShift)
LCtrl RCtrl LT(1,Space) RAlt LGui RGui LAlt LT(1,Space)
"""
encoders = [["MouseWheelDown", "MouseWheelUp"], ["AudioVolDown", "AudioVolUp"]]

[[keymap.layer]]
name = "symbols"
keys = """
_ _ _ _ _ _ _ _ _ _ Equal _
WM(LeftBracket,LShift) WM(RightBracket,LShift) KpSlash LeftBracket RightBracket Minus WM(Kc9,LShift) WM(Kc0,LShift) _ KpAsterisk Equal Delete
_ Up _ _ Down Right _ Left _ Quote WM(Quote,LShift) _
_ _ _ _ _ _ WM(Kc7,LShift) _ _ WM(Backslash,LShift) _ _ Backslash _
_ _ _ PrintScreen _ _ _ _
"""
encoders = [["No", "No"], ["No", "No"]]

[ble]
enabled = true

[behavior.morse]
enable_flow_tap = true
prior_idle_time = "120ms"
hold_on_other_press = true
hold_timeout = "250ms"
gap_timeout = "250ms"
morses = [
    { tap = "LShift", hold = "LShift", double_tap = "No", hold_after_tap = "LCtrl", profile = "vial_td0" },
]

[behavior.morse.profiles]
vial_td0 = { hold_timeout = "200ms", gap_timeout = "200ms" }

[host]
vial_enabled = false
rynk_enabled = true
# Physical keys (row, col) held together to unlock Rynk-gated commands
# (matrix tester, bootloader jump, storage reset). In the 5x12 matrix:
# (4,8) = RAlt and (4,9) = RCtrl (both on the right thumb cluster, so you can
# unlock with the right hand only).
unlock_keys = [[4, 8], [4, 9]]

[storage]
enabled = true
clear_storage = false

[split]
connection = "ble"

[split.central]
rows = 0
cols = 0
row_offset = 0
col_offset = 0
[split.central.matrix]
matrix_type = "normal"
row_pins = []
col_pins = []
[split.central.display]
driver = "ssd1306"
size = "128x64"
rotation = 0
renderer = "crate::renderer::DongleRenderer"
# Poll interval in ms for animations (omit to disable polling - event-driven only).
render_interval = 33
# Minimum time in ms between event-driven renders.
min_render_interval = 10
[split.central.display.protocol.i2c]
instance = "TWISPI0"
sda = "P0_17"
scl = "P0_20"
address = 0x3C

[[split.peripheral]]
rows = 5
cols = 6
row_offset = 0
col_offset = 0
battery_adc_pin = "vddh"
battery_user_description = "Left"
[split.peripheral.matrix]
matrix_type = "normal"
col_pins = ["P0_02", "P1_15", "P1_13", "P1_11", "P0_10", "P0_09"]
row_pins = ["P0_22", "P0_24", "P1_00", "P0_11", "P1_04"]
[[split.peripheral.input_device.encoder]]
pin_a = "P0_31"
pin_b = "P0_29"
phase = "resolution"
resolution = 2
internal_pullup = true
reverse = true
[split.peripheral.display]
driver = "ssd1306"
size = "128x32"
rotation = 90
renderer = "OledRenderer"
[split.peripheral.display.protocol.i2c]
instance = "TWISPI0"
sda = "P0_17"
scl = "P0_20"
address = 0x3C

[[split.peripheral]]
rows = 5
cols = 6
row_offset = 0
col_offset = 6
battery_adc_pin = "vddh"
battery_user_description = "Right"
[split.peripheral.matrix]
matrix_type = "normal"
col_pins = ["P0_02", "P1_15", "P1_13", "P1_11", "P0_10", "P0_09"]
row_pins = ["P0_22", "P0_24", "P1_00", "P0_11", "P1_04"]
[[split.peripheral.input_device.encoder]]
pin_a = "P0_29"
pin_b = "P0_31"
phase = "resolution"
resolution = 2
internal_pullup = true
reverse = true
[split.peripheral.display]
driver = "ssd1306"
size = "128x32"
rotation = 90
renderer = "OledRenderer"
[split.peripheral.display.protocol.i2c]
instance = "TWISPI0"
sda = "P0_17"
scl = "P0_20"
address = 0x3C
